name: benchmark-comparison

# Timings are noisy and slow, so this is not a per-PR gate. Run it manually or
# nightly and inspect the uploaded artifacts.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  compare:
    name: Cross-engine comparison (Linux, Release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OPA (pinned)
        run: |
          curl -fsSL -o /tmp/opa \
            https://github.com/open-policy-agent/opa/releases/download/v1.22.4/opa_linux_amd64_static
          echo "35e3b352e715e80624ead6c89930d8585f6f7d94cdc409eb2a9fe36620dcccba  /tmp/opa" \
            | sha256sum -c -
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cedar-cli-4.14.1-${{ runner.os }}

      - name: Install Cedar CLI (pinned)
        run: |
          if ! command -v cedar >/dev/null; then
            cargo install cedar-policy-cli --version 4.14.1 --locked
          fi
          cedar --version

      - name: Install Casbin (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install casbin==1.43.0

      - name: Build YOG (Release)
        run: |
          cmake -S yog -B yog/build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build yog/build-release --parallel

      - name: Generate corpus
        run: python benchmarks/gen_corpus.py

      - name: Run comparison
        run: python benchmarks/compare.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: |
            benchmarks/results/comparison.json
            benchmarks/results/comparison.md
            benchmarks/results/versions.json
            benchmarks/results/translations/
          if-no-files-found: error

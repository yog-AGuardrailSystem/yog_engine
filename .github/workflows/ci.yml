name: ci

on:
  push:
  pull_request:

jobs:
  c-tests:
    name: C build, sanitizers and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S yog -B yog/build -DCMAKE_BUILD_TYPE=Debug -DYOG_SANITIZE=ON

      - name: Build
        run: cmake --build yog/build --parallel

      - name: Run C tests
        run: ctest --test-dir yog/build --output-on-failure

      - name: Differential check against yog.py
        run: python yog/tests/differential/diff_vs_python.py --yogc yog/build/yogc

  python-tests:
    name: Python reference tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run Python tests
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest yog/tests tests -q
          else
            python -m pytest yog/tests -q
          fi

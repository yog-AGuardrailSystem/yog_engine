name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-tests:
    name: C build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cmake -S yog -B yog/build -DCMAKE_BUILD_TYPE=Debug -DYOG_SANITIZE=ON
          else
            cmake -S yog -B yog/build -DCMAKE_BUILD_TYPE=Debug
          fi

      - name: Build
        run: cmake --build yog/build --config Debug --parallel
      
      - name: Run C tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ctest --test-dir yog/build -C Debug --output-on-failure
          else
            ctest --test-dir yog/build --output-on-failure
          fi

      - name: Set compiler executable path
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "YOGC=yog/build/Debug/yogc.exe" >> "$GITHUB_ENV"
            echo "BENCH_YOG=yog/build/Debug/bench_yog.exe" >> "$GITHUB_ENV"
          else
            echo "YOGC=yog/build/yogc" >> "$GITHUB_ENV"
            echo "BENCH_YOG=yog/build/bench_yog" >> "$GITHUB_ENV"
          fi

      - name: Differential check against yog.py
        shell: bash
        run: python yog/tests/differential/diff_vs_python.py --yogc "$YOGC"

      - name: Independent conformance suite
        shell: bash
        run: python yog/tests/conformance/run_conformance.py --yogc "$YOGC"

      - name: Property-based oracle
        shell: bash
        run: |
          python yog/tests/property/property_conformance.py --yogc "$YOGC"

      - name: AI guardrail examples
        shell: bash
        run: python examples/ai_guardrails/enforce_demo.py --yogc "$YOGC"

      - name: Differential check of language version 2 (C engine vs reference)
        shell: bash
        run: python yog/tests/differential/diff_v2.py --yogc "$YOGC"

      - name: Exhaustive small-model differential (C engine vs reference)
        shell: bash
        run: python yog/tests/differential/diff_small_models.py --yogc "$YOGC"

      - name: Platform tests against the real engine
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m pip install pytest
          YOGC="$PWD/$YOGC" python -m pytest tests/platform -q

      - name: Benchmark smoke test
        shell: bash
        run: |
          python benchmarks/gen_corpus.py
          "$BENCH_YOG" check benchmarks/generated/small.yog u0000 can_access r0000 --iterations 100
          "$BENCH_YOG" compile benchmarks/generated/small.yog --iterations 10

  bindings:
    name: Bindings and in-process harnesses (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOG_LIB_DIR: ${{ github.workspace }}/yog/build-release
      YOG_LIBRARY: ${{ github.workspace }}/yog/build-release/libyog.so
      LD_LIBRARY_PATH: ${{ github.workspace }}/yog/build-release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: "stable"
          check-latest: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master
        with:
          toolchain: stable

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Build YOG Release (shared library)
        run: |
          cmake -S yog -B yog/build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build yog/build-release --parallel

      - name: Python ctypes binding tests
        run: python -m pytest bindings/python/tests -q

      - name: Rust wrapper tests
        run: cargo test --release --manifest-path bindings/rust/Cargo.toml

      - name: Build Go harnesses (cgo over the public ABI)
        run: |
          mkdir -p benchmarks/results/bin
          (cd benchmarks/adapters/opa_go && go build -o ../../results/bin/opa-bench .)
          (cd benchmarks/adapters/yog_go && go build -o ../../results/bin/yog-go-bench .)

      - name: Go binding smoke test
        run: |
          python benchmarks/gen_corpus.py
          ./benchmarks/results/bin/yog-go-bench --mode load \
            --policy benchmarks/generated/common-small.yog

  wasm:
    name: WebAssembly build (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    container:
      image: emscripten/emsdk:3.1.64
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the module
        run: |
          emcmake cmake -S yog -B yog/build-wasm -DYOG_WASM=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build yog/build-wasm
          mkdir -p bindings/wasm/dist
          cp yog/build-wasm/yog.js yog/build-wasm/yog.wasm bindings/wasm/dist/

      - name: Test the JavaScript wrapper under Node
        run: node --test bindings/wasm/test

  python-tests:
    name: Python reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run Python tests
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest yog/tests tests -q
          else
            python -m pytest yog/tests -q
          fi

name: ci

on:
  push:
  pull_request:

jobs:
  c-tests:
    name: C build, sanitizers and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S yog -B yog/build -DCMAKE_BUILD_TYPE=Debug -DYOG_SANITIZE=ON

      - name: Build
        run: cmake --build yog/build --parallel

      - name: Run C tests
        run: ctest --test-dir yog/build --output-on-failure

      - name: Differential check against yog.py
        run: python yog/tests/differential/diff_vs_python.py --yogc yog/build/yogc

      - name: Independent conformance suite
        run: python yog/tests/conformance/run_conformance.py --yogc yog/build/yogc

      - name: Property-based oracle
        run: python yog/tests/property/property_conformance.py

      - name: AI guardrail examples
        run: python examples/ai_guardrails/enforce_demo.py --yogc yog/build/yogc

      - name: Benchmark smoke test
        run: |
          python benchmarks/gen_corpus.py
          yog/build/bench_yog check benchmarks/generated/small.yog u0000 can_access r0000 --iterations 100
          yog/build/bench_yog compile benchmarks/generated/small.yog --iterations 10

  python-tests:
    name: Python reference tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run Python tests
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest yog/tests tests -q
          else
            python -m pytest yog/tests -q
          fi
